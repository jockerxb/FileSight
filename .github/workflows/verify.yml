name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: macOS build and privacy tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Show toolchain
        run: swift --version
      - name: Verify search and incremental index
        run: zsh scripts/verify.sh
      - name: Verify sandbox privacy boundaries
        run: python3 scripts/verify-privacy.py
      - name: Build preview package and verify entitlements
        run: zsh scripts/build-app.sh --preview
