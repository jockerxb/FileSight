name: Feature request / 功能建议
description: Suggest an improvement that preserves FileSight's speed and privacy / 建议不牺牲速度与隐私的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 要解决的问题
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Usage scenario / 使用场景
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Product boundaries / 产品边界
      options:
        - label: This can work locally without uploading filenames, paths, queries, or document contents. / 该建议可以在不上传文件名、路径、搜索词或正文的前提下实现。
          required: true
