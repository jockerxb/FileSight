name: Bug report / 问题反馈
description: Report a reproducible FileSight problem / 反馈可复现的千里眼问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请使用示例文件名和路径，不要上传个人文档、真实路径、账号或其他隐私信息。
        Use sample filenames and paths. Do not upload personal documents, real paths, account details, or other private information.
  - type: input
    id: version
    attributes:
      label: FileSight version / 千里眼版本
      placeholder: "2.3 (30)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS and Mac / 系统与机型
      placeholder: "macOS 15.x, Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Replace private names with examples before submitting.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result / 预期与实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed personal filenames, paths, and document contents. / 我已移除个人文件名、路径和文档内容。
          required: true
